<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Course Tracker</title>
<meta name="theme-color" content="#0B0F12" />
<meta name="description" content="46-day course completion tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tracker" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B0F12; --surface:#141B20; --surface2:#1B242B; --line:#26323A;
    --amber:#F2A93B; --green:#4FBF8B; --red:#E2574C;
    --text:#E8EDF0; --textDim:#8B98A3; --textFaint:#5B6670;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:90px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .header{padding:20px 20px 4px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px;}
  .title{font-size:22px; font-weight:700; letter-spacing:-0.3px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-label{font-size:10px; color:var(--textDim); margin-bottom:4px; letter-spacing:0.5px;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700;}
  .row{display:flex; align-items:center;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.3px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:600; border:none; cursor:pointer; flex:1;}
  .btn-primary{background:var(--amber); color:#1A1204;}
  .btn-secondary{background:var(--surface2); color:var(--text); border:1px solid var(--line);}
  .btn-danger{background:rgba(226,87,76,0.13); color:var(--red); border:1px solid rgba(226,87,76,0.35);}
  .btn-ghost{background:transparent; color:var(--textDim); border:1px solid var(--line);}
  input, textarea, select{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--text); font-size:14px; font-family:inherit; outline:none;}
  input:focus, textarea:focus{border-color:var(--amber);}
  .field-label{font-size:11px; color:var(--textDim); margin-bottom:6px; letter-spacing:0.5px;}
  .field{margin-bottom:14px;}
  .daydot{width:14px; height:14px; border-radius:50%; border:2px solid; flex-shrink:0; cursor:pointer; padding:0;}
  .navbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:40;}
  .navbtn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; color:var(--textFaint);}
  .navbtn.active{color:var(--amber);}
  .navbtn span{font-size:9.5px; font-weight:500;}
  .navbtn.active span{font-weight:700;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; z-index:50;}
  .modal-sheet{background:var(--surface); border-top:1px solid var(--line); border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:480px; margin:0 auto; max-height:85vh; overflow-y:auto;}
  .iconbtn{background:none; border:none; color:var(--textDim); cursor:pointer; padding:4px;}
  svg{display:block;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ---------------- constants ---------------- */
var COLORS = { amber:"#F2A93B", green:"#4FBF8B", red:"#E2574C", line:"#26323A", textDim:"#8B98A3", textFaint:"#5B6670", text:"#E8EDF0" };
var STORAGE_KEY = "course-tracker-state-v1";
var DEFAULT_COURSE = { name:"Embedded Systems Mastery", totalHours:138, dailyTarget:3, totalDays:46, startDate: todayStr() };
var DEFAULT_MODULES = [
  {id:"m1", name:"Embedded C", hours:40},
  {id:"m2", name:"ARM Cortex-M", hours:34},
  {id:"m3", name:"STM32", hours:38},
  {id:"m4", name:"RTOS", hours:26}
];

/* ---------------- utils ---------------- */
function todayStr(d){ d = d || new Date(); var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function addDays(dateStr, n){ var d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function dayIndexFor(dateStr, startDate){ var a=new Date(startDate+"T00:00:00"), b=new Date(dateStr+"T00:00:00"); return Math.round((b-a)/86400000)+1; }
function fmtHM(min){ min = Math.max(0, Math.round(min)); var h=Math.floor(min/60), m=min%60; if(h===0) return m+"m"; if(m===0) return h+"h"; return h+"h "+m+"m"; }
function fmtHMSigned(min){ return (min<0?"-":"+")+fmtHM(Math.abs(min)); }
function clamp(v,lo,hi){ return Math.min(hi, Math.max(lo, v)); }
function niceDate(dateStr){ var d=new Date(dateStr+"T00:00:00"); return d.toLocaleDateString(undefined,{month:"short", day:"numeric"}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------------- persistence ---------------- */
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    course: DEFAULT_COURSE,
    modules: DEFAULT_MODULES,
    sessions: [],
    settings: { partialBreaksStreak:true, remindersEnabled:false, reminderTime:"20:00", reminderCount:1 },
    timer: { running:false, startedAt:null, elapsedMs:0 }
  };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); }catch(e){} }

/* ---------------- derived calculations ---------------- */
function computeDerived(state){
  var course = state.course, sessions = state.sessions, settings = state.settings;
  var today = todayStr();
  var totalMinutesTarget = course.totalHours*60;
  var byDay = {};
  sessions.forEach(function(s){ byDay[s.date] = (byDay[s.date]||0) + s.durationMin; });
  var completedMinutes = sessions.reduce(function(a,s){return a+s.durationMin;},0);
  var completedHours = completedMinutes/60;
  var remainingHours = Math.max(0, course.totalHours - completedHours);
  var overallPercent = clamp((completedMinutes/totalMinutesTarget)*100, 0, 999);
  var rawDayIndex = dayIndexFor(today, course.startDate);
  var currentDayIndex = clamp(rawDayIndex, 1, course.totalDays);
  var elapsedFullDays = clamp(currentDayIndex-1, 0, course.totalDays);
  var daysRemaining = Math.max(0, course.totalDays - currentDayIndex + 1);
  var todayMinutes = byDay[today] || 0;
  var targetMinutes = course.dailyTarget*60;
  var remainingTodayMinutes = Math.max(0, targetMinutes - todayMinutes);
  var todayComplete = todayMinutes >= targetMinutes;
  var expectedMinutes = elapsedFullDays * targetMinutes;
  var scheduleDiffMinutes = completedMinutes - expectedMinutes;
  var deficitMinutes = Math.max(0, -scheduleDiffMinutes);
  var recommendedTodayMinutes = targetMinutes + deficitMinutes;
  var behindHours = -scheduleDiffMinutes/60;
  var status = behindHours>6 ? "significantly-behind" : behindHours>1.5 ? "slightly-behind" : "on-track";
  var avgDailyMinutes = elapsedFullDays>0 ? completedMinutes/elapsedFullDays : (todayMinutes>0?todayMinutes:0);
  var remainingMinutesTotal = Math.max(0, totalMinutesTarget - completedMinutes);
  var requiredDailyAvgMinutes = daysRemaining>0 ? remainingMinutesTotal/daysRemaining : 0;
  var expectedCompletionDate = null;
  if(avgDailyMinutes>0){ var daysNeeded = Math.ceil(remainingMinutesTotal/avgDailyMinutes); expectedCompletionDate = addDays(today, daysNeeded); }
  var targetCompletionDate = addDays(course.startDate, course.totalDays-1);

  var days = [];
  for(var i=1;i<=course.totalDays;i++){
    var date = addDays(course.startDate, i-1);
    var minutes = byDay[date] || 0;
    var dayStatus;
    if(date===today) dayStatus="today";
    else if(date>today) dayStatus="upcoming";
    else if(minutes>=targetMinutes) dayStatus="completed";
    else if(minutes>0) dayStatus="partial";
    else dayStatus="missed";
    days.push({index:i, date:date, minutes:minutes, status:dayStatus});
  }

  var streak=0, longestStreak=0, running=0, daysCompleted=0, daysPartial=0, daysMissed=0;
  var bestDay = {date:null, minutes:0};
  days.forEach(function(d){
    if(d.date>today) return;
    if(d.minutes>bestDay.minutes) bestDay = {date:d.date, minutes:d.minutes};
    if(d.status==="completed"){ daysCompleted++; running+=1; }
    else if(d.status==="partial"){ daysPartial++; if(settings.partialBreaksStreak) running=0; }
    else if(d.status==="missed"){ daysMissed++; running=0; }
    else if(d.status==="today"){ if(d.minutes>=targetMinutes) running+=1; }
    if(running>longestStreak) longestStreak=running;
  });
  streak = running;

  var cumulative = [], acc=0;
  for(var j=0;j<days.length;j++){
    var d2 = days[j];
    if(d2.date>today) break;
    acc += d2.minutes;
    cumulative.push({day:d2.index, hours:+(acc/60).toFixed(2), targetHours:+((d2.index*targetMinutes)/60).toFixed(2)});
  }
  var dailyBars = days.filter(function(d){return d.date<=today;}).map(function(d){ return {day:d.index, hours:+(d.minutes/60).toFixed(2)}; });

  return {
    today:today, totalMinutesTarget:totalMinutesTarget, byDay:byDay, completedMinutes:completedMinutes, completedHours:completedHours,
    remainingHours:remainingHours, overallPercent:overallPercent, currentDayIndex:currentDayIndex, elapsedFullDays:elapsedFullDays,
    daysRemaining:daysRemaining, todayMinutes:todayMinutes, targetMinutes:targetMinutes, remainingTodayMinutes:remainingTodayMinutes,
    todayComplete:todayComplete, expectedMinutes:expectedMinutes, scheduleDiffMinutes:scheduleDiffMinutes, deficitMinutes:deficitMinutes,
    recommendedTodayMinutes:recommendedTodayMinutes, status:status, avgDailyMinutes:avgDailyMinutes, requiredDailyAvgMinutes:requiredDailyAvgMinutes,
    expectedCompletionDate:expectedCompletionDate, targetCompletionDate:targetCompletionDate, days:days, streak:streak, longestStreak:longestStreak,
    daysCompleted:daysCompleted, daysPartial:daysPartial, daysMissed:daysMissed, bestDay:bestDay, cumulative:cumulative, dailyBars:dailyBars,
    courseComplete: completedMinutes >= totalMinutesTarget
  };
}

/* ---------------- icons (inline svg) ---------------- */
var ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  stats:'<path d="M4 20V10M12 20V4M20 20v-7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  play:'<path d="M6 3l14 9-14 9V3z"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  stop:'<rect x="5" y="5" width="14" height="14" rx="1"/>',
  x:'<path d="M18 6L6 18M6 6l18 18"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  flame:'<path d="M12 2s5 5.5 5 10a5 5 0 01-10 0c0-1 .5-2 1-3 .3 1 1 1.5 1 1.5C8 7 12 2 12 2z"/>'
};
function svgIcon(name, size, color, extra){
  size = size||18; color = color||"currentColor"; extra = extra||"";
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '+extra+'>'+ICONS[name]+'</svg>';
}

/* ---------------- charts (inline svg) ---------------- */
function barChartSVG(data, w, h){
  if(!data.length) return '<div style="color:'+COLORS.textFaint+';font-size:12px;padding:20px;text-align:center;">No sessions logged yet</div>';
  var max = Math.max.apply(null, data.map(function(d){return d.hours;}).concat([0.1]));
  var padL=24, padB=16, padT=8, innerW=w-padL-4, innerH=h-padB-padT;
  var bw = innerW/data.length;
  var bars = data.map(function(d,i){
    var bh = (d.hours/max)*innerH;
    var x = padL + i*bw + bw*0.15;
    var bwid = bw*0.7;
    var y = padT + (innerH-bh);
    return '<rect x="'+x+'" y="'+y+'" width="'+bwid+'" height="'+Math.max(1,bh)+'" rx="2" fill="'+COLORS.amber+'"><title>Day '+d.day+': '+d.hours+'h</title></rect>';
  }).join("");
  var gridLines = '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+innerH)+'" stroke="'+COLORS.line+'"/>';
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+gridLines+bars+'</svg>';
}
function lineChartSVG(data, w, h){
  if(!data.length) return '<div style="color:'+COLORS.textFaint+';font-size:12px;padding:20px;text-align:center;">No data yet</div>';
  var maxH = Math.max.apply(null, data.map(function(d){return Math.max(d.hours, d.targetHours);}).concat([0.1]));
  var padL=28, padB=16, padT=8, innerW=w-padL-4, innerH=h-padB-padT;
  var n = data.length;
  function pt(i, val){
    var x = padL + (n<=1 ? innerW/2 : (i/(n-1))*innerW);
    var y = padT + innerH - (val/maxH)*innerH;
    return [x,y];
  }
  var actualPts = data.map(function(d,i){ return pt(i,d.hours).join(","); }).join(" ");
  var targetPts = data.map(function(d,i){ return pt(i,d.targetHours).join(","); }).join(" ");
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+innerH)+'" stroke="'+COLORS.line+'"/>'+
    '<polyline points="'+targetPts+'" fill="none" stroke="'+COLORS.textFaint+'" stroke-width="1.5" stroke-dasharray="4 4"/>'+
    '<polyline points="'+actualPts+'" fill="none" stroke="'+COLORS.amber+'" stroke-width="2.5"/>'+
    '</svg>';
}

/* ---------------- App ---------------- */
var App = {
  state: loadState(),
  tab: "home",
  timerInterval: null,
  init: function(){
    if(!this.state.timer) this.state.timer = {running:false, startedAt:null, elapsedMs:0};
    this.render();
    var self = this;
    window.addEventListener("visibilitychange", function(){ if(!document.hidden) self.render(); });
  },
  setTab: function(t){ this.tab = t; this.render(); },
  save: function(){ saveState(); },
  addSession: function(sess){
    this.state.sessions.push(Object.assign({id:uid(), date:todayStr(), source:"manual"}, sess));
    this.save(); this.render();
  },
  render: function(){
    var el = document.getElementById("app");
    var d = computeDerived(this.state);
    var body = "";
    if(d.courseComplete && this.tab==="home"){
      body = renderCompletion(d, this.state);
    } else if(this.tab==="home"){
      body = renderHome(d, this.state);
    } else if(this.tab==="calendar"){
      body = renderCalendar(d, this.state);
    } else if(this.tab==="timer"){
      body = renderTimer(d, this.state);
    } else if(this.tab==="stats"){
      body = renderStats(d, this.state);
    } else if(this.tab==="settings"){
      body = renderSettings(this.state);
    }
    el.innerHTML = body + renderNav(this.tab);
    bindEvents(this, d);
    clearInterval(this.timerInterval);
    if(this.tab==="timer" && this.state.timer.running){
      var self = this;
      this.timerInterval = setInterval(function(){ updateTimerDisplay(self.state); }, 500);
    }
  }
};

/* ---------------- render: header/badge/daydot ---------------- */
function renderHeader(subtitle, title){
  return '<div class="header"><div class="eyebrow">'+esc(subtitle)+'</div><div class="title">'+esc(title)+'</div></div>';
}
function statusBadge(status){
  var map = {
    "on-track": {label:"On Track", color:COLORS.green, icon:"check"},
    "slightly-behind": {label:"Slightly Behind", color:COLORS.amber, icon:"alert"},
    "significantly-behind": {label:"Significantly Behind", color:COLORS.red, icon:"x"}
  };
  var m = map[status];
  return '<div class="badge" style="background:'+m.color+'1A;border:1px solid '+m.color+'55;color:'+m.color+'">'+svgIcon(m.icon,14,m.color)+m.label.toUpperCase()+'</div>';
}
function dayDotColor(status){
  return {completed:COLORS.green, partial:COLORS.amber, missed:COLORS.red, today:COLORS.amber, upcoming:COLORS.textFaint}[status];
}
function dayDot(d, size, clickable){
  var color = dayDotColor(d.status);
  var filled = (d.status==="completed"||d.status==="partial"||d.status==="today");
  var glow = d.status==="today" ? "box-shadow:0 0 8px "+color+";" : "";
  var tag = clickable ? "button" : "div";
  var attrs = clickable ? ' class="daydot day-dot-btn" data-day="'+d.index+'"' : ' class="daydot"';
  return '<'+tag+attrs+' style="width:'+size+'px;height:'+size+'px;background:'+(filled?color:"transparent")+';border-color:'+color+';'+glow+'" title="Day '+d.index+' · '+niceDate(d.date)+'"></'+tag+'>';
}
function ringSVG(percent, size, stroke, color){
  var r = (size-stroke)/2, c = 2*Math.PI*r, pct = clamp(percent,0,100), offset = c-(pct/100)*c;
  var cx=size/2, cy=size/2;
  return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke="'+COLORS.line+'" stroke-width="'+stroke+'" fill="none"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke="'+color+'" stroke-width="'+stroke+'" fill="none" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" stroke-linecap="round" style="transition:stroke-dashoffset .6s ease"/>'+
    '</svg>';
}

/* ---------------- Home ---------------- */
function renderHome(d, state){
  var motivation;
  if(d.courseComplete) motivation = "🎉 Course complete — nice work.";
  else if(d.streak>=3) motivation = "🔥 You're on a "+d.streak+"-day streak!";
  else if(d.scheduleDiffMinutes>=60) motivation = "🚀 You're "+fmtHM(d.scheduleDiffMinutes)+" ahead of schedule.";
  else if(d.daysRemaining<=5) motivation = "💪 Only "+d.daysRemaining+" day"+(d.daysRemaining===1?"":"s")+" left.";
  else if(d.overallPercent>=50) motivation = "🎯 "+Math.round(d.overallPercent)+"% through the course — keep going.";
  else motivation = "📚 Log today's session to stay on pace.";

  var catchup = "";
  if(d.deficitMinutes>0){
    catchup = '<div style="padding:12px 20px 0"><div class="card" style="background:'+COLORS.amber+'12;border-color:'+COLORS.amber+'55">'+
      '<div style="font-size:12px;color:'+COLORS.amber+';font-weight:600;margin-bottom:6px;">CATCH-UP RECOMMENDED</div>'+
      '<div style="font-size:13px;line-height:1.5;">Today\'s target: '+fmtHM(d.targetMinutes)+' · Catch-up: '+fmtHM(d.deficitMinutes)+'<br>Recommended study today: <b>'+fmtHM(d.recommendedTodayMinutes)+'</b></div>'+
      '</div></div>';
  }

  var dots = d.days.map(function(day){ return dayDot(day, 12, false); }).join("");

  return renderHeader(state.course.name, "Day "+d.currentDayIndex+" / "+state.course.totalDays) +
    '<div style="display:flex;justify-content:center;padding:20px 0 8px">'+
      '<div style="position:relative;width:168px;height:168px;">'+
        ringSVG(d.overallPercent, 168, 12, COLORS.amber)+
        '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;">'+
          '<div class="mono" style="font-size:30px;font-weight:700;">'+Math.round(d.overallPercent)+'%</div>'+
          '<div style="font-size:11px;color:'+COLORS.textDim+';margin-top:2px;">'+fmtHM(d.completedMinutes)+' / '+state.course.totalHours+'h</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;justify-content:center;margin-bottom:20px;">'+statusBadge(d.status)+'</div>'+
    '<div style="padding:0 20px" class="grid2">'+
      '<div class="card"><div class="stat-label">TODAY\'S TARGET</div><div class="stat-value">'+fmtHM(d.targetMinutes)+'</div></div>'+
      '<div class="card"><div class="stat-label">COMPLETED TODAY</div><div class="stat-value" style="color:'+(d.todayComplete?COLORS.green:COLORS.text)+'">'+fmtHM(d.todayMinutes)+'</div></div>'+
      '<div class="card"><div class="stat-label">REMAINING TODAY</div><div class="stat-value">'+(d.todayComplete?"Done ✓":fmtHM(d.remainingTodayMinutes))+'</div></div>'+
      '<div class="card"><div class="stat-label">SCHEDULE</div><div class="stat-value" style="color:'+(d.scheduleDiffMinutes>=0?COLORS.green:COLORS.red)+'">'+fmtHMSigned(d.scheduleDiffMinutes)+'</div></div>'+
    '</div>'+
    catchup+
    '<div style="padding:12px 20px 0"><div class="card row" style="gap:10px;">'+svgIcon("flame",18,COLORS.amber)+'<div style="font-size:13px;">'+motivation+'</div></div></div>'+
    '<div style="padding:16px 20px 0"><div style="font-size:11px;color:'+COLORS.textDim+';margin-bottom:8px;letter-spacing:1px;">46-DAY TRACE</div>'+
      '<div class="card" style="display:flex;flex-wrap:wrap;gap:6px;">'+dots+'</div></div>'+
    '<div style="padding:16px 20px 0;display:flex;gap:10px;">'+
      '<button class="btn btn-primary" id="btn-add-session">'+svgIcon("plus",16,"#1A1204")+' Add Study Session</button>'+
      '<button class="btn btn-secondary" id="btn-open-timer">'+svgIcon("timer",16)+' Timer</button>'+
    '</div>'+
    addSessionModalHTML();
}

/* ---------------- Calendar ---------------- */
function renderCalendar(d, state){
  var cells = d.days.map(function(day){
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">'+
      dayDot(day, 20, true)+
      '<span class="mono" style="font-size:9px;color:'+COLORS.textFaint+';">'+day.index+'</span></div>';
  }).join("");
  var legendItems = [["completed","Completed",COLORS.green],["partial","Partial",COLORS.amber],["missed","Missed",COLORS.red],["today","Today",COLORS.amber],["upcoming","Upcoming",COLORS.textFaint]];
  var legend = legendItems.map(function(li){
    var filled = li[0]==="upcoming" ? "transparent" : li[2];
    return '<div class="row" style="gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:'+filled+';border:2px solid '+li[2]+';"></div><span style="font-size:11px;color:'+COLORS.textDim+';">'+li[1]+'</span></div>';
  }).join("");
  return renderHeader("Consistency","46-Day Calendar")+
    '<div style="padding:8px 20px"><div class="card"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;justify-items:center;">'+cells+'</div></div></div>'+
    '<div style="padding:0 20px"><div class="card" style="display:flex;flex-wrap:wrap;gap:6px 14px;">'+legend+'</div></div>'+
    '<div id="day-detail"></div>';
}
function dayDetailHTML(d, state, idx){
  var day = d.days[idx-1];
  if(!day) return "";
  var sess = state.sessions.filter(function(s){ return s.date===day.date; });
  var sessLines = sess.map(function(s){ return '<div style="margin-top:4px;color:'+COLORS.textDim+';font-size:11px;">• '+fmtHM(s.durationMin)+(s.topic?" — "+esc(s.topic):"")+'</div>'; }).join("");
  return '<div style="padding:12px 20px"><div class="card">'+
    '<div class="row" style="justify-content:space-between;margin-bottom:8px;"><div style="font-size:13px;font-weight:700;">Day '+day.index+' · '+niceDate(day.date)+'</div>'+
    '<button class="iconbtn" id="close-day-detail">'+svgIcon("x",16)+'</button></div>'+
    '<div style="font-size:12px;color:'+COLORS.textDim+';margin-bottom:6px;">Studied: <span class="mono" style="color:'+COLORS.text+';">'+fmtHM(day.minutes)+'</span> / target '+fmtHM(d.targetMinutes)+'</div>'+
    '<div style="font-size:11px;color:'+COLORS.textFaint+';">'+sess.length+' session(s) logged'+sessLines+'</div>'+
    '</div></div>';
}

/* ---------------- Timer ---------------- */
function timerElapsedMs(timer){ return timer.running ? (timer.elapsedMs + (Date.now()-timer.startedAt)) : timer.elapsedMs; }
function renderTimer(d, state){
  var timer = state.timer;
  var ms = timerElapsedMs(timer);
  var h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000);
  var timeStr = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  var controls = "";
  if(!timer.running && timer.elapsedMs===0){
    controls = '<button class="btn btn-primary" id="timer-start">'+svgIcon("play",16,"#1A1204")+' Start Study Session</button>';
  } else if(timer.running){
    controls = '<button class="btn btn-secondary" id="timer-pause">'+svgIcon("pause",16)+' Pause</button>'+
      '<button class="btn btn-danger" id="timer-stop">'+svgIcon("stop",16,COLORS.red)+' Stop</button>';
  } else {
    controls = '<button class="btn btn-secondary" id="timer-start">'+svgIcon("play",16)+' Resume</button>'+
      '<button class="btn btn-danger" id="timer-stop">'+svgIcon("stop",16,COLORS.red)+' Stop</button>'+
      '<button class="btn btn-ghost" id="timer-reset">'+svgIcon("x",16)+' Reset</button>';
  }
  return renderHeader("Focus session","Study Timer")+
    '<div style="display:flex;justify-content:center;padding:28px 0"><div id="timer-display" class="mono" style="font-size:52px;font-weight:700;letter-spacing:1px;color:'+(timer.running?COLORS.amber:COLORS.text)+';'+(timer.running?"text-shadow:0 0 20px "+COLORS.amber+"55;":"")+'">'+timeStr+'</div></div>'+
    '<div style="display:flex;justify-content:center;gap:14px;padding:0 20px;">'+controls+'</div>'+
    '<div style="padding:24px 20px 0"><div class="card"><div style="font-size:11px;color:'+COLORS.textDim+';margin-bottom:6px;">SESSION WILL BE LOGGED TO TODAY</div><div style="font-size:12px;color:'+COLORS.textFaint+';">Closing the app mid-session is safe — time keeps accruing and resumes when you reopen.</div></div></div>'+
    '<div id="timer-log-modal"></div>';
}
function updateTimerDisplay(state){
  var ms = timerElapsedMs(state.timer);
  var h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000);
  var el = document.getElementById("timer-display");
  if(el) el.textContent = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function timerLogModalHTML(pendingMin){
  return '<div class="modal-overlay" id="timer-log-overlay"><div class="modal-sheet" onclick="event.stopPropagation()">'+
    '<div class="row" style="justify-content:space-between;margin-bottom:16px;"><div style="font-size:16px;font-weight:700;">Log Session</div><button class="iconbtn" id="timer-log-close">'+svgIcon("x",20)+'</button></div>'+
    '<div class="field"><div class="field-label">DURATION (MINUTES)</div><input type="number" id="tl-min" value="'+pendingMin+'"/></div>'+
    '<div class="field"><div class="field-label">TOPIC (OPTIONAL)</div><input type="text" id="tl-topic" placeholder="e.g. RTOS — task scheduling"/></div>'+
    '<div class="field"><div class="field-label">NOTES (OPTIONAL)</div><textarea id="tl-notes" rows="3"></textarea></div>'+
    '<button class="btn btn-primary" id="tl-save" style="width:100%;">Save Session</button>'+
    '</div></div>';
}

/* ---------------- Stats ---------------- */
function renderStats(d, state){
  var cards = [
    ["Total studied", fmtHM(d.completedMinutes)],
    ["Course %", Math.round(d.overallPercent)+"%"],
    ["Avg / day", fmtHM(d.avgDailyMinutes)],
    ["Current streak", d.streak+"d 🔥"],
    ["Longest streak", d.longestStreak+"d"],
    ["Days completed", d.daysCompleted, COLORS.green],
    ["Days partial", d.daysPartial, COLORS.amber],
    ["Days missed", d.daysMissed, COLORS.red],
    ["Ahead / behind", fmtHMSigned(d.scheduleDiffMinutes), d.scheduleDiffMinutes>=0?COLORS.green:COLORS.red],
    ["Best day", d.bestDay.date?fmtHM(d.bestDay.minutes):"—"]
  ];
  var cardsHTML = cards.map(function(c){
    return '<div class="card"><div class="stat-label">'+c[0].toUpperCase()+'</div><div class="stat-value" style="color:'+(c[2]||COLORS.text)+'">'+c[1]+'</div></div>';
  }).join("");

  var modulesHTML = "";
  if(state.modules && state.modules.length){
    var running = d.completedMinutes;
    var rows = state.modules.map(function(mod){
      var modMin = mod.hours*60;
      var filled = Math.max(0, Math.min(modMin, running));
      running -= filled;
      var pct = modMin>0 ? (filled/modMin)*100 : 0;
      return '<div><div class="row" style="justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>'+esc(mod.name)+'</span><span class="mono" style="color:'+COLORS.textDim+';">'+fmtHM(filled)+' / '+mod.hours+'h</span></div>'+
        '<div style="height:6px;border-radius:4px;background:'+COLORS.line+';overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+(pct>=100?COLORS.green:COLORS.amber)+';"></div></div></div>';
    }).join('<div style="height:12px"></div>');
    modulesHTML = '<div style="padding:16px 20px 0"><div style="font-size:11px;color:'+COLORS.textDim+';margin-bottom:8px;letter-spacing:1px;">MODULES</div><div class="card">'+rows+'</div></div>';
  }

  return renderHeader("Progress","Statistics")+
    '<div style="padding:8px 20px" class="grid2">'+cardsHTML+'</div>'+
    '<div style="padding:16px 20px 0"><div style="font-size:11px;color:'+COLORS.textDim+';margin-bottom:8px;letter-spacing:1px;">STUDY HOURS PER DAY</div><div class="card" style="height:180px;">'+barChartSVG(d.dailyBars, 320, 160)+'</div></div>'+
    '<div style="padding:16px 20px 0"><div style="font-size:11px;color:'+COLORS.textDim+';margin-bottom:8px;letter-spacing:1px;">CUMULATIVE COMPLETION</div><div class="card" style="height:180px;">'+lineChartSVG(d.cumulative, 320, 160)+'</div></div>'+
    modulesHTML;
}

/* ---------------- Settings ---------------- */
function renderSettings(state){
  var c = state.course, s = state.settings;
  return renderHeader("Configure","Settings")+
    '<div style="padding:8px 20px"><div class="card">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:12px;">COURSE SETUP</div>'+
      '<div class="field"><div class="field-label">COURSE NAME</div><input id="st-name" value="'+esc(c.name)+'"/></div>'+
      '<div class="field"><div class="field-label">TOTAL COURSE DURATION (HOURS)</div><input id="st-hours" type="number" value="'+c.totalHours+'"/></div>'+
      '<div class="field"><div class="field-label">DAILY STUDY TARGET (HOURS)</div><input id="st-target" type="number" step="0.5" value="'+c.dailyTarget+'"/></div>'+
      '<div class="field"><div class="field-label">TARGET NUMBER OF DAYS</div><input id="st-days" type="number" value="'+c.totalDays+'"/></div>'+
      '<div class="field"><div class="field-label">START DATE</div><input id="st-start" type="date" value="'+c.startDate+'"/></div>'+
      '<div id="st-auto" style="font-size:11px;color:'+COLORS.textFaint+';">Auto: '+(c.dailyTarget>0?Math.ceil(c.totalHours/c.dailyTarget):"—")+' days needed at this pace.</div>'+
    '</div></div>'+
    '<div style="padding:12px 20px"><div class="card">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:12px;">STREAK RULES</div>'+
      '<label class="row" style="gap:10px;font-size:13px;cursor:pointer;"><input type="checkbox" id="st-partial" '+(s.partialBreaksStreak?"checked":"")+' style="width:16px;height:16px;accent-color:'+COLORS.amber+';"/> A partially completed day breaks my streak</label>'+
    '</div></div>'+
    '<div style="padding:12px 20px"><div class="card">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:12px;">REMINDERS</div>'+
      '<label class="row" style="gap:10px;font-size:13px;cursor:pointer;margin-bottom:12px;"><input type="checkbox" id="st-rem-enabled" '+(s.remindersEnabled?"checked":"")+' style="width:16px;height:16px;accent-color:'+COLORS.amber+';"/> Enable daily reminders</label>'+
      (s.remindersEnabled ? (
        '<div class="field"><div class="field-label">REMINDER TIME</div><input id="st-rem-time" type="time" value="'+s.reminderTime+'"/></div>'+
        '<div class="field"><div class="field-label">REMINDERS PER DAY</div><input id="st-rem-count" type="number" min="1" max="5" value="'+s.reminderCount+'"/></div>'+
        '<div style="font-size:11px;color:'+COLORS.textFaint+';">This app uses your browser\'s notification permission to remind you at this time while installed, if your device allows background notifications.</div>'
      ) : "")+
    '</div></div>'+
    '<div style="padding:0 20px"><button class="btn btn-primary" id="st-save" style="width:100%;">Save Changes</button></div>';
}

/* ---------------- Completion ---------------- */
function renderCompletion(d, state){
  var daysTaken = d.days.filter(function(x){ return x.status==="completed"||x.status==="partial"||(x.status==="today"&&x.minutes>0); }).length;
  var cards = [
    ["Total studied", fmtHM(d.completedMinutes)],
    ["Days taken", daysTaken],
    ["Avg / day", fmtHM(d.avgDailyMinutes)],
    ["Target", state.course.totalHours+"h"],
    ["Target date", niceDate(d.targetCompletionDate)],
    ["Actual date", niceDate(d.today)],
    ["Longest streak", d.longestStreak+"d"],
    ["Missed days", d.daysMissed]
  ];
  var cardsHTML = cards.map(function(c){
    return '<div class="card"><div class="stat-label">'+c[0].toUpperCase()+'</div><div class="stat-value">'+c[1]+'</div></div>';
  }).join("");
  return '<div style="padding:40px 20px 20px;text-align:center;">'+
    '<div style="font-size:40px;margin-bottom:8px;">🎉</div>'+
    '<div style="font-size:20px;font-weight:700;margin-bottom:4px;">Course Completed!</div>'+
    '<div style="font-size:13px;color:'+COLORS.textDim+';margin-bottom:24px;">'+esc(state.course.name)+'</div>'+
    '</div><div style="padding:0 20px" class="grid2">'+cardsHTML+'</div>';
}

/* ---------------- Nav ---------------- */
function renderNav(tab){
  var items = [["home","home","Home"],["calendar","calendar","Calendar"],["timer","timer","Timer"],["stats","stats","Stats"],["settings","settings","Settings"]];
  var btns = items.map(function(it){
    var active = tab===it[0];
    return '<button class="navbtn'+(active?" active":"")+'" data-tab="'+it[0]+'">'+svgIcon(it[1],20, active?COLORS.amber:COLORS.textFaint)+'<span>'+it[2]+'</span></button>';
  }).join("");
  return '<div class="navbar">'+btns+'</div>';
}

/* ---------------- Add Session Modal ---------------- */
function addSessionModalHTML(){
  return '<div id="add-session-modal"></div>';
}
function openAddSessionModal(){
  var el = document.getElementById("add-session-modal");
  el.innerHTML = '<div class="modal-overlay" id="as-overlay"><div class="modal-sheet" onclick="event.stopPropagation()">'+
    '<div class="row" style="justify-content:space-between;margin-bottom:16px;"><div style="font-size:16px;font-weight:700;">Add Study Session</div><button class="iconbtn" id="as-close">'+svgIcon("x",20)+'</button></div>'+
    '<div class="field"><div class="field-label">START TIME</div><input type="time" id="as-start"/></div>'+
    '<div class="field"><div class="field-label">END TIME</div><input type="time" id="as-end"/></div>'+
    '<div class="field"><div class="field-label">OR ENTER DURATION DIRECTLY (MINUTES)</div><input type="number" id="as-manual" placeholder="e.g. 90"/></div>'+
    '<div class="field"><div class="field-label">COURSE / TOPIC</div><input type="text" id="as-topic" placeholder="e.g. STM32 — GPIO config"/></div>'+
    '<div class="field"><div class="field-label">NOTES (OPTIONAL)</div><textarea id="as-notes" rows="2"></textarea></div>'+
    '<div style="font-size:12px;color:'+COLORS.textDim+';margin-bottom:14px;">Duration: <b id="as-duration-label" style="color:'+COLORS.amber+';">0m</b></div>'+
    '<button class="btn btn-primary" id="as-save" style="width:100%;">Save Session</button>'+
    '</div></div>';

  function computeDuration(){
    var startV = document.getElementById("as-start").value;
    var endV = document.getElementById("as-end").value;
    var manualV = document.getElementById("as-manual").value;
    var minutes = 0;
    if(startV && endV){
      var sp = startV.split(":").map(Number), ep = endV.split(":").map(Number);
      var diff = (ep[0]*60+ep[1]) - (sp[0]*60+sp[1]);
      if(diff<0) diff += 24*60;
      minutes = diff;
      document.getElementById("as-manual").disabled = true;
    } else {
      document.getElementById("as-manual").disabled = false;
      minutes = +manualV || 0;
    }
    document.getElementById("as-duration-label").textContent = fmtHM(minutes);
    return minutes;
  }
  ["as-start","as-end","as-manual"].forEach(function(id){
    document.getElementById(id).addEventListener("input", computeDuration);
  });
  document.getElementById("as-close").addEventListener("click", function(){ el.innerHTML=""; });
  document.getElementById("as-overlay").addEventListener("click", function(){ el.innerHTML=""; });
  document.getElementById("as-save").addEventListener("click", function(){
    var minutes = computeDuration();
    if(minutes>0){
      App.addSession({
        durationMin: minutes,
        topic: document.getElementById("as-topic").value,
        notes: document.getElementById("as-notes").value
      });
    }
  });
}

/* ---------------- event binding ---------------- */
function bindEvents(app, d){
  document.querySelectorAll(".navbtn").forEach(function(b){
    b.addEventListener("click", function(){ app.setTab(b.getAttribute("data-tab")); });
  });

  if(app.tab==="home"){
    var addBtn = document.getElementById("btn-add-session");
    if(addBtn) addBtn.addEventListener("click", openAddSessionModal);
    var timerBtn = document.getElementById("btn-open-timer");
    if(timerBtn) timerBtn.addEventListener("click", function(){ app.setTab("timer"); });
  }

  if(app.tab==="calendar"){
    document.querySelectorAll(".day-dot-btn").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = +b.getAttribute("data-day");
        document.getElementById("day-detail").innerHTML = dayDetailHTML(d, app.state, idx);
        var closeBtn = document.getElementById("close-day-detail");
        if(closeBtn) closeBtn.addEventListener("click", function(){ document.getElementById("day-detail").innerHTML=""; });
      });
    });
  }

  if(app.tab==="timer"){
    var startBtn = document.getElementById("timer-start");
    var pauseBtn = document.getElementById("timer-pause");
    var stopBtn = document.getElementById("timer-stop");
    var resetBtn = document.getElementById("timer-reset");
    if(startBtn) startBtn.addEventListener("click", function(){
      app.state.timer.running = true; app.state.timer.startedAt = Date.now(); app.save(); app.render();
    });
    if(pauseBtn) pauseBtn.addEventListener("click", function(){
      app.state.timer.elapsedMs += (Date.now()-app.state.timer.startedAt);
      app.state.timer.running = false; app.state.timer.startedAt = null; app.save(); app.render();
    });
    if(resetBtn) resetBtn.addEventListener("click", function(){
      app.state.timer = {running:false, startedAt:null, elapsedMs:0}; app.save(); app.render();
    });
    if(stopBtn) stopBtn.addEventListener("click", function(){
      var finalMs = timerElapsedMs(app.state.timer);
      var pendingMin = Math.round(finalMs/60000);
      var modalEl = document.getElementById("timer-log-modal");
      modalEl.innerHTML = timerLogModalHTML(pendingMin);
      document.getElementById("timer-log-close").addEventListener("click", function(){ modalEl.innerHTML=""; });
      document.getElementById("timer-log-overlay").addEventListener("click", function(){ modalEl.innerHTML=""; });
      document.getElementById("tl-save").addEventListener("click", function(){
        var min = +document.getElementById("tl-min").value || 0;
        if(min>0){
          app.state.sessions.push({id:uid(), date:todayStr(), durationMin:min, topic:document.getElementById("tl-topic").value, notes:document.getElementById("tl-notes").value, source:"timer"});
        }
        app.state.timer = {running:false, startedAt:null, elapsedMs:0};
        app.save(); modalEl.innerHTML=""; app.render();
      });
    });
  }

  if(app.tab==="settings"){
    document.getElementById("st-save").addEventListener("click", function(){
      var c = app.state.course;
      c.name = document.getElementById("st-name").value;
      c.totalHours = +document.getElementById("st-hours").value;
      c.dailyTarget = +document.getElementById("st-target").value;
      c.totalDays = +document.getElementById("st-days").value;
      c.startDate = document.getElementById("st-start").value;
      app.state.settings.partialBreaksStreak = document.getElementById("st-partial").checked;
      app.state.settings.remindersEnabled = document.getElementById("st-rem-enabled").checked;
      var remTime = document.getElementById("st-rem-time");
      var remCount = document.getElementById("st-rem-count");
      if(remTime) app.state.settings.reminderTime = remTime.value;
      if(remCount) app.state.settings.reminderCount = +remCount.value;
      app.save(); app.render();
    });
    var remEnabled = document.getElementById("st-rem-enabled");
    if(remEnabled) remEnabled.addEventListener("change", function(){
      app.state.settings.remindersEnabled = remEnabled.checked; app.render();
    });
  }
}

/* ---------------- boot ---------------- */
App.init();

/* ---------------- service worker registration ---------------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
